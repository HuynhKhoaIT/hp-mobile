name: Deploy staging (Supabase)

# Đẩy migration lên dungquat-staging khi main có migration mới, hoặc chạy tay từ tab Actions.
# Cần 3 repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   Supabase Dashboard → Account → Access Tokens
#   STAGING_PROJECT_REF     lyyonoszuuljvbnwbvlk
#   STAGING_DB_PASSWORD     mật khẩu database lúc tạo dungquat-staging
# Prod không deploy ở đây (chỉ khi gắn tag v*, workflow riêng, cần duyệt) — docs/RUNBOOK.md.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ xem trước, không áp"
        type: boolean
        default: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: db push → dungquat-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secret
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu secret cho $v (xem đầu file workflow)"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Xem trước migration
        run: supabase db push --linked --dry-run

      - name: Áp migration
        if: github.event_name == 'push' || inputs.dry_run == false
        run: supabase db push --linked

      - name: Trạng thái migration
        run: supabase migration list --linked
