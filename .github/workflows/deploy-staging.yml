name: Deploy staging (Supabase)

# Đẩy migration lên dungquat-staging khi main có migration mới, hoặc chạy tay từ tab Actions.
# Kết nối thẳng database qua pooler (--db-url), không dùng `supabase link`:
# link gọi Management API nên token giới hạn quyền bị 403.
# Cần 2 repository secret (Settings → Secrets and variables → Actions):
#   STAGING_PROJECT_REF     lyyonoszuuljvbnwbvlk
#   STAGING_DB_PASSWORD     mật khẩu database lúc tạo dungquat-staging
# Prod không deploy ở đây (chỉ khi gắn tag v*, workflow riêng, cần duyệt) — docs/RUNBOOK.md.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ xem trước, không áp"
        type: boolean
        default: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: db push → dungquat-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      # Session pooler của project (Dashboard → Connect → Session pooler). Không phải bí mật.
      POOLER_HOST: aws-0-ap-southeast-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v5

      - name: Kiểm tra secret
        run: |
          for v in SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu secret cho $v (xem đầu file workflow)"; exit 1; fi
          done

      - name: Tạo chuỗi kết nối
        run: |
          pw=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$pw"
          echo "DB_URL=postgresql://postgres.${PROJECT_REF}:${pw}@${POOLER_HOST}:5432/postgres" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Xem trước migration
        run: supabase db push --db-url "$DB_URL" --dry-run

      - name: Áp migration
        if: github.event_name == 'push' || inputs.dry_run == false
        run: supabase db push --db-url "$DB_URL"

      - name: Trạng thái migration
        run: supabase migration list --db-url "$DB_URL"
